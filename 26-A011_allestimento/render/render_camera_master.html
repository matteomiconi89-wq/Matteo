<title>Camera Master 26-A011</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#0E0C0A; --panel:#1C1815; --panel-hi:#272119;
  --line:#3A3128; --noce:#B98A52; --ottone:#D8A657;
  --nebbia:#A79E93; --panna:#F2EBE1;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--panna);font-family:var(--body);overflow:hidden}
#scena{position:fixed;inset:0;display:block;cursor:grab}
#scena:active{cursor:grabbing}
.chrome{position:fixed;z-index:5;pointer-events:none}
.chrome>*{pointer-events:auto}

/* --- testata pagina --- */
#intesta{top:22px;left:24px;display:flex;flex-direction:column;gap:2px}
#intesta .cod{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--ottone);text-transform:uppercase}
#intesta h1{font-family:var(--display);font-weight:600;font-size:34px;line-height:.95;margin:2px 0 0;letter-spacing:.01em;text-wrap:balance}
#intesta .sub{font-size:12.5px;color:var(--nebbia);max-width:34ch;line-height:1.45}

/* --- quote reali --- */
#quote{top:24px;right:24px;display:flex;gap:18px;background:rgba(28,24,21,.72);
  border:1px solid var(--line);border-radius:3px;padding:11px 15px;backdrop-filter:blur(8px)}
#quote div{display:flex;flex-direction:column;gap:3px}
#quote dt{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--nebbia)}
#quote dd{margin:0;font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;color:var(--panna)}
#quote dd b{color:var(--ottone);font-weight:500}

/* --- storyboard inquadrature --- */
#regia{left:24px;right:24px;bottom:22px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
#scatti{display:flex;gap:8px;flex-wrap:wrap}
.scatto{background:rgba(28,24,21,.72);border:1px solid var(--line);color:var(--nebbia);
  font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.03em;
  padding:8px 14px 7px;border-radius:3px;cursor:pointer;position:relative;overflow:hidden;
  transition:color .2s,border-color .2s;backdrop-filter:blur(8px)}
.scatto .num{font-family:var(--mono);font-size:9.5px;color:var(--ottone);margin-right:7px;letter-spacing:.1em}
.scatto:hover{color:var(--panna);border-color:var(--noce)}
.scatto[aria-current="true"]{color:var(--panna);border-color:var(--ottone)}
.scatto .barra{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--ottone)}
#play{background:var(--ottone);color:#1A1206;border:0;border-radius:3px;font-family:var(--display);
  font-weight:700;font-size:15px;letter-spacing:.06em;padding:9px 16px 8px;cursor:pointer;text-transform:uppercase}
#play:hover{background:var(--noce)}
:focus-visible{outline:2px solid var(--ottone);outline-offset:2px}

/* --- lettura pezzo --- */
#pezzo{right:24px;bottom:22px;background:rgba(28,24,21,.85);border:1px solid var(--line);
  border-left:2px solid var(--ottone);border-radius:3px;padding:10px 14px;min-width:210px;backdrop-filter:blur(8px)}
#pezzo .et{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--nebbia)}
#pezzo .cod{font-family:var(--mono);font-size:13px;color:var(--panna);margin-top:3px;word-break:break-all}
#pezzo .mis{font-family:var(--mono);font-size:11px;color:var(--noce);margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.6}
#pezzo .mat{color:var(--panna)}
#pezzo .prov{color:var(--nebbia);font-size:10px}
@media (max-width:760px){
  #intesta h1{font-size:26px} #quote{display:none} #pezzo{display:none}
  #regia{left:14px;right:14px;bottom:14px}
}
</style>

<canvas id="scena"></canvas>

<div class="chrome" id="intesta">
  <span class="cod">26-A011 · B&amp;B Car · rif. Dino Chiesa</span>

  <span class="sub">Render dai modelli CAD esecutivi. Ogni pezzo porta il codice di distinta e il materiale letto dai layer del DWG: clicca per leggerli.</span>
</div>

<dl class="chrome" id="quote">

</dl>

</div>

</div>

2D6","ruv":0.3,"met":0.0,"nome":"Vetro stratificato satinato sp.8","finitura":"satinato"},"_MATERASSO":{"base":"#CFC7B8","ruv":0.95,"met":0.0,"nome":"Materasso","finitura":"non a capitolato"},"_GUANCIALE":{"base":"#EDE8DF","ruv":1.0,"met":0.0,"nome":"Guanciale","finitura":"non a capitolato"}};
// stesso materiale, ma ante e frontali un filo piu' chiari della carcassa:
// e' la stessa lastra con la venatura girata, non un materiale diverso.
function tono(n){const u=n.toUpperCase();
  if(u.includes('ANTA')||u.includes('FRONTALE')||u.includes('PORTA'))   return 1.10;
  if(u.includes('RIPIANO')||u.includes('BASE')||u.includes('CIELO'))    return 0.94;
  if(u.includes('SCHIENA')||u.includes('FONDO')||u.includes('RETRO'))   return 0.84;
  return 1.0;}
function scuri(hex,k){const v=parseInt(hex.slice(1),16);
  const f=c=>Math.max(0,Math.min(255,Math.round(c*k)));
  return (f(v>>16&255)<<16)|(f(v>>8&255)<<8)|f(v&255);}

const cv=document.getElementById('scena');
const ren=new THREE.WebGLRenderer({canvas:cv,antialias:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2));
ren.shadowMap.enabled=true; ren.shadowMap.type=THREE.PCFSoftShadowMap;
ren.outputEncoding=THREE.sRGBEncoding;
ren.toneMapping=THREE.ACESFilmicToneMapping; ren.toneMappingExposure=1.05;
const sc=new THREE.Scene();
sc.background=new THREE.Color(0x0E0C0A);
sc.fog=new THREE.Fog(0x0E0C0A,6.5,17);
const cam=new THREE.PerspectiveCamera(42,1,.05,60);

// --- luci: chiave calda dal lato finestra + riempimento freddo + cielo ---
sc.add(new THREE.HemisphereLight(0xBFCBD6,0x2A2118,.55));
const key=new THREE.DirectionalLight(0xFFE9C9,2.0);
key.position.set(2.4,3.4,-2.0); key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
const sh=key.shadow.camera; sh.left=-4;sh.right=5;sh.top=4;sh.bottom=-4;sh.near=.5;sh.far=14;
key.shadow.bias=-0.0006; key.shadow.normalBias=0.02;
sc.add(key);
const fill=new THREE.DirectionalLight(0x9FB4C6,.45); fill.position.set(-2.6,2.0,1.6); sc.add(fill);

// --- guscio stanza ---
const RX=[-1.864,1.864], RZ=[-1.781,1.781], H=2.293;   // vano reale: 3728 x 3562 x 2293
function piano(w,d,mat,pos,rot){const g=new THREE.PlaneGeometry(w,d);const m=new THREE.Mesh(g,mat);
  m.position.set(...pos); if(rot)m.rotation.set(...rot); m.receiveShadow=true; sc.add(m); return m;}
const mPav=new THREE.MeshStandardMaterial({color:0x5A4634,roughness:.85});
const mMuro=new THREE.MeshStandardMaterial({color:0xC9C1B4,roughness:.95});
const mSoff=new THREE.MeshStandardMaterial({color:0xE6DFD3,roughness:1});
const EXT=2.05, LP=RX[1]-RX[0]+EXT, CXP=(RX[0]+RX[1]+EXT)/2;   // pavimento e soffitto proseguono nel living
piano(LP,RZ[1]-RZ[0],mPav ,[CXP,0,0],[-Math.PI/2,0,0]);
piano(LP,RZ[1]-RZ[0],mSoff,[CXP,H,0],[ Math.PI/2,0,0]);
piano(RZ[1]-RZ[0],H,mMuro,[RX[0],H/2,0],[0,Math.PI/2,0]);          // parete anteriore, dietro la testata
piano(RX[1]-RX[0],H,mMuro,[0,H/2,RZ[1]],[0,Math.PI,0]);             // parete ingresso, dietro l'armadio
piano(RX[1]-RX[0],H,mMuro,[0,H/2,RZ[0]],[0,0,0]);                   // fianco che si allarga

// --- arredo dai modelli CAD ---
const mats={};
function mat(layer,nome){
  const d=MATERIALI[layer]||MATERIALI._default, k=tono(nome);
  const id=layer+'|'+k;
  if(!mats[id]) mats[id]=new THREE.MeshStandardMaterial(
      {color:scuri(d.base,k), roughness:d.ruv, metalness:d.met});
  return mats[id];}
const pick=[]; let nPezzi=0;
for(const key in SCENA){
  const grp=new THREE.Group(); sc.add(grp);
  SCENA[key].parts.forEach(p=>{
    const pos=[];
    p.f.forEach(f=>f.forEach(i=>{const s=S(p.v[i]);pos.push(s[0],s[1],s[2]);}));
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
    g.computeVertexNormals(); g.computeBoundingBox();
    const me=new THREE.Mesh(g,mat(p.m,p.n));
    me.castShadow=true; me.receiveShadow=true;
    me.userData={nome:p.n,pezzo:SCENA[key].label,mat:p.m,prov:p.p};
    grp.add(me); pick.push(me); nPezzi++;
  });
}
document.getElementById('npezzi').textContent=nPezzi+' solidi';

// --- inquadrature ---
const SHOTS=[
 {n:'Dalla porta',      d:9,  p0:[2.80,1.66, 1.30], p1:[1.78,1.56, 1.02], t0:[ 0.20,1.02, 0.20], t1:[-0.55,0.98,-0.10]},
 {n:'Armadio · 6 casse',d:9,  p0:[-1.20,1.55,-0.58], p1:[ 1.36,1.50,-0.58], t0:[-1.10,1.02, 1.45], t1:[ 1.26,1.02, 1.45]},
 {n:'Testata e letto',  d:8,  p0:[ 1.28,1.62,-0.78], p1:[ 0.18,1.30,-0.56], t0:[-1.32,0.94,-0.42], t1:[-1.62,1.06,-0.46]},
 {n:'Spaccato sul fianco',d:12, orbita:true}   // passata esterna oltre la parete che si allarga
];
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const lerp3=(a,b,k)=>[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k];
let iShot=0, tShot=0, corre=true, manuale=false;
const ridotto=matchMedia('(prefers-reduced-motion: reduce)').matches;

const barre=[];
const cont=document.getElementById('scatti');
SHOTS.forEach((s,i)=>{
  const b=document.createElement('button');
  b.className='scatto'; b.type='button';
  b.innerHTML='<span class="num">'+String(i+1).padStart(2,'0')+'</span>'+s.n+'<span class="barra"></span>';
  b.onclick=()=>{iShot=i;tShot=0;manuale=false;corre=true;aggiornaUI();};
  cont.appendChild(b); barre.push(b);
});
function aggiornaUI(){
  barre.forEach((b,i)=>b.setAttribute('aria-current', i===iShot?'true':'false'));
  play.textContent = corre? 'Pausa':'Riprendi';
}
const play=document.getElementById('play');
play.onclick=()=>{corre=!corre; if(corre)manuale=false; aggiornaUI();};

function inquadra(s,k){
  if(s.orbita){   // arco 55->118 gradi: unico settore da cui nulla si frappone alla stanza
    const e=ease(k), a=-(55+63*e)*Math.PI/180, r=3.10-0.55*e, y=1.75-0.40*e;
    return {p:[Math.cos(a)*r,y,-0.10+Math.sin(a)*r], t:[-0.20,1.00,-0.05]};}
  const e=ease(k);
  return {p:lerp3(s.p0,s.p1,e), t:lerp3(s.t0,s.t1,e)};
}
// orbita manuale (trascinamento) — sospende l'animazione
let giu=false,px=0,py=0,az=-0.6,el=0.42,rad=3.1;
const FUOCO=[-0.20,1.00,-0.05];
cv.addEventListener('pointerdown',e=>{giu=true;px=e.clientX;py=e.clientY;cv.setPointerCapture(e.pointerId);
  if(!manuale){                       // aggancia i comandi manuali all'inquadratura corrente
    const dx=cam.position.x-FUOCO[0], dy=cam.position.y-FUOCO[1], dz=cam.position.z-FUOCO[2];
    rad=Math.max(1.3,Math.hypot(dx,dy,dz)); az=Math.atan2(dz,dx);
    el=Math.max(.05,Math.min(1.15,Math.asin(Math.max(-1,Math.min(1,dy/rad)))));
  }
  manuale=true;});
cv.addEventListener('pointermove',e=>{if(!giu)return;
  az-=(e.clientX-px)*.006; el=Math.max(.05,Math.min(1.15,el+(e.clientY-py)*.005));
  px=e.clientX;py=e.clientY;});
addEventListener('pointerup',()=>giu=false);
cv.addEventListener('wheel',e=>{e.preventDefault();manuale=true;
  rad=Math.max(1.3,Math.min(7,rad*(1+Math.sign(e.deltaY)*.09)));},{passive:false});

// --- selezione pezzo ---
const ray=new THREE.Raycaster(), pt=new THREE.Vector2();
const pcod=document.getElementById('pcod'), pmis=document.getElementById('pmis');
let mosso=false;
cv.addEventListener('pointerdown',()=>mosso=false);
cv.addEventListener('pointermove',()=>{if(giu)mosso=true;});
cv.addEventListener('click',e=>{
  if(mosso)return;
  pt.x=(e.clientX/innerWidth)*2-1; pt.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(pt,cam);
  const h=ray.intersectObjects(pick,false);
  if(!h.length){pcod.textContent='clicca un elemento';pmis.textContent='';return;}
  const o=h[0].object, bb=o.geometry.boundingBox;
  pcod.textContent=o.userData.nome;
  const dx=Math.round((bb.max.x-bb.min.x)*1000),dy=Math.round((bb.max.y-bb.min.y)*1000),dz=Math.round((bb.max.z-bb.min.z)*1000);
  const d=MATERIALI[o.userData.mat];
  const prov={dwg:'letto dal DWG',ereditato:'ereditato dalla cassa',
              contenuto:'dedotto dalla pianta',gemello:'copiato dal gemello'}[o.userData.prov]||'';
  pmis.innerHTML=o.userData.pezzo+' · '+dx+' × '+dz+' × '+dy+' mm<br>'
    +'<span class="mat">'+(d?d.nome:'materiale non determinato')+'</span>'
    +'<span class="prov"> · '+prov+'</span>';
});

function ridimensiona(){const w=innerWidth,h=innerHeight;
  ren.setSize(w,h); cam.aspect=w/h; cam.updateProjectionMatrix();}
addEventListener('resize',ridimensiona); ridimensiona();

let prec=performance.now();
if(ridotto){corre=false;}
aggiornaUI();
(function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-prec)/1000,.05); prec=now;
  const s=SHOTS[iShot];
  if(corre&&!manuale&&!ridotto){
    tShot+=dt/s.d;
    if(tShot>=1){tShot=0;iShot=(iShot+1)%SHOTS.length;aggiornaUI();}
  }
  barre.forEach((b,i)=>b.querySelector('.barra').style.width=(i===iShot? (tShot*100).toFixed(1):'0')+'%');
  if(manuale){
    cam.position.set(FUOCO[0]+Math.cos(az)*Math.cos(el)*rad, FUOCO[1]+Math.sin(el)*rad,
                     FUOCO[2]+Math.sin(az)*Math.cos(el)*rad);
    cam.lookAt(FUOCO[0],FUOCO[1],FUOCO[2]);
  }else{
    const q=inquadra(s,tShot);
    cam.position.set(q.p[0],q.p[1],q.p[2]);
    cam.lookAt(q.t[0],q.t[1],q.t[2]);
  }
  ren.render(sc,cam);
})(prec);
</script>
