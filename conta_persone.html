<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Conta Persone — Los Passo</title>
<style>
  :root{
    --bg:#101418; --panel:#1a2026; --line:#2a323b;
    --amber:#f5a623; --green:#39c46d; --red:#e05252;
    --txt:#e8ecef; --dim:#8a949e;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--txt);
    font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;
  }
  header{
    padding:10px 14px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--line); flex-shrink:0;
  }
  header h1{font-size:14px; letter-spacing:2px; text-transform:uppercase; font-weight:600}
  header h1 span{color:var(--amber)}
  #status{font-size:11px; color:var(--dim)}
  #status.on{color:var(--green)}

  /* VIDEO */
  #videoWrap{
    position:relative; background:#000; flex-shrink:0;
    width:100%; aspect-ratio:4/3; max-height:42dvh; overflow:hidden;
  }
  video{width:100%; height:100%; object-fit:cover}
  canvas{position:absolute; inset:0; width:100%; height:100%}
  #videoOff{
    position:absolute; inset:0; display:flex; flex-direction:column; gap:10px;
    align-items:center; justify-content:center; color:var(--dim); font-size:13px;
    text-align:center; padding:20px;
  }

  /* COUNTERS */
  #counters{
    flex:1; display:flex; flex-direction:column; justify-content:center;
    padding:8px 14px; gap:8px; min-height:0;
  }
  #present{
    text-align:center;
  }
  #present .num{
    font-size:clamp(56px,18vw,96px); font-weight:700; line-height:1;
    font-variant-numeric:tabular-nums; color:var(--amber);
  }
  #present .lbl{font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--dim); margin-top:2px}
  #inout{display:flex; gap:10px}
  .box{
    flex:1; background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:8px 10px; text-align:center;
  }
  .box .num{font-size:28px; font-weight:700; font-variant-numeric:tabular-nums}
  .box.in .num{color:var(--green)}
  .box.out .num{color:var(--red)}
  .box .lbl{font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--dim)}

  /* BUTTONS */
  #controls{padding:10px 14px 16px; flex-shrink:0; display:flex; flex-direction:column; gap:10px}
  .row{display:flex; gap:10px}
  button{
    flex:1; border:none; border-radius:12px; padding:16px 8px;
    font-size:16px; font-weight:700; color:#fff; background:var(--panel);
    border:1px solid var(--line); cursor:pointer;
  }
  button:active{transform:scale(.97)}
  .bIn{background:#153a25; border-color:#1f5c39; color:var(--green)}
  .bOut{background:#3a1717; border-color:#5c2424; color:var(--red)}
  .small{padding:10px 8px; font-size:13px; font-weight:600; color:var(--dim)}
  .bCam{background:#2b2413; border-color:#4d3f1a; color:var(--amber)}
</style>
</head>
<body>

<header>
  <h1>CONTA <span>PERSONE</span></h1>
  <div id="status">manuale</div>
</header>

<div id="videoWrap">
  <video id="video" autoplay muted playsinline></video>
  <canvas id="overlay"></canvas>
  <div id="videoOff">
    <div>📷 Modalità automatica spenta</div>
    <div style="font-size:11px">Premi "Avvia camera AI": punta il telefono verso il passaggio, chi attraversa la linea viene contato da solo.</div>
  </div>
</div>

<div id="counters">
  <div id="present">
    <div class="num" id="nPres">0</div>
    <div class="lbl">Presenti ora</div>
  </div>
  <div id="inout">
    <div class="box in"><div class="num" id="nIn">0</div><div class="lbl">Entrati</div></div>
    <div class="box out"><div class="num" id="nOut">0</div><div class="lbl">Usciti</div></div>
  </div>
</div>

<div id="controls">
  <div class="row">
    <button class="bIn" onclick="manual(1)">+1 ENTRATA</button>
    <button class="bOut" onclick="manual(-1)">+1 USCITA</button>
  </div>
  <div class="row">
    <button class="bCam" id="btnCam" onclick="toggleCam()">▶ Avvia camera AI</button>
  </div>
  <div class="row">
    <button class="small" onclick="invertDir()">↔ Inverti direzione</button>
    <button class="small" onclick="resetAll()">Azzera</button>
  </div>
</div>

<script>
let cIn=0, cOut=0, dirInvert=false;
let running=false, model=null, stream=null, tracks=[], nextId=1;

// ---- persistenza semplice in memoria di sessione ----
function save(){ try{ sessionStorage.setItem('cp',JSON.stringify({cIn,cOut})); }catch(e){} }
try{ const s=JSON.parse(sessionStorage.getItem('cp')); if(s){cIn=s.cIn||0;cOut=s.cOut||0;} }catch(e){}

function render(){
  document.getElementById('nIn').textContent=cIn;
  document.getElementById('nOut').textContent=cOut;
  document.getElementById('nPres').textContent=Math.max(0,cIn-cOut);
  save();
}
function manual(d){ if(d>0)cIn++; else cOut++; buzz(); render(); }
function resetAll(){ if(confirm('Azzerare tutti i contatori?')){cIn=0;cOut=0;render();} }
function invertDir(){ dirInvert=!dirInvert; flashStatus(dirInvert?'direzione: destra→sinistra = ENTRATA':'direzione: sinistra→destra = ENTRATA'); }
function buzz(){ if(navigator.vibrate) navigator.vibrate(40); }
function flashStatus(t){ const s=document.getElementById('status'); const old=s.textContent; s.textContent=t; setTimeout(()=>{s.textContent=running?'AI attiva':'manuale'; s.className=running?'on':'';},2000); }

// ---- caricamento AI ----
function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src=src;
    s.onload=res; s.onerror=()=>rej(new Error('load fail '+src));
    document.head.appendChild(s);
  });
}
async function loadModel(){
  if(model) return model;
  document.getElementById('status').textContent='carico modello AI…';
  await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js');
  await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js');
  model=await cocoSsd.load({base:'lite_mobilenet_v2'});
  return model;
}

// ---- camera ----
async function toggleCam(){
  if(running){ stopCam(); return; }
  const btn=document.getElementById('btnCam');
  btn.textContent='… avvio';
  try{
    await loadModel();
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'environment', width:{ideal:640}, height:{ideal:480}}, audio:false
    });
    const v=document.getElementById('video');
    v.srcObject=stream; await v.play();
    document.getElementById('videoOff').style.display='none';
    running=true;
    btn.textContent='■ Ferma camera';
    const s=document.getElementById('status'); s.textContent='AI attiva'; s.className='on';
    if('wakeLock' in navigator){ try{ navigator.wakeLock.request('screen'); }catch(e){} }
    loop();
  }catch(err){
    btn.textContent='▶ Avvia camera AI';
    alert('Non riesco ad avviare la modalità automatica qui.\n\n'+err.message+'\n\nSe sei dentro l\'app Claude: scarica il file e aprilo con Chrome/Safari. Intanto puoi usare i pulsanti manuali.');
  }
}
function stopCam(){
  running=false;
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  document.getElementById('videoOff').style.display='flex';
  document.getElementById('btnCam').textContent='▶ Avvia camera AI';
  const s=document.getElementById('status'); s.textContent='manuale'; s.className='';
  const c=document.getElementById('overlay'); c.getContext('2d').clearRect(0,0,c.width,c.height);
  tracks=[];
}

// ---- tracking + linea di attraversamento ----
async function loop(){
  const v=document.getElementById('video');
  const c=document.getElementById('overlay');
  const ctx=c.getContext('2d');
  while(running){
    if(v.videoWidth){
      c.width=v.videoWidth; c.height=v.videoHeight;
      const preds=await model.detect(v);
      const people=preds.filter(p=>p.class==='person'&&p.score>0.5);
      const lineX=c.width/2;
      const now=performance.now();

      // associa detection a tracce esistenti (nearest neighbor)
      const used=new Set();
      for(const p of people){
        const cx=p.bbox[0]+p.bbox[2]/2, cy=p.bbox[1]+p.bbox[3]/2;
        let best=null,bd=1e9;
        for(const t of tracks){
          if(used.has(t.id)) continue;
          const d=Math.hypot(t.x-cx,t.y-cy);
          if(d<bd && d<c.width*0.25){bd=d;best=t;}
        }
        if(best){
          // attraversamento linea?
          const wasLeft=best.x<lineX, isLeft=cx<lineX;
          if(wasLeft!==isLeft && now-best.lastCross>1200){
            best.lastCross=now;
            let entering = wasLeft && !isLeft;      // sx -> dx = entrata
            if(dirInvert) entering=!entering;
            if(entering) cIn++; else cOut++;
            buzz(); render();
          }
          best.x=cx; best.y=cy; best.seen=now; best.box=p.bbox; used.add(best.id);
        }else{
          tracks.push({id:nextId++,x:cx,y:cy,seen:now,lastCross:0,box:p.bbox});
        }
      }
      tracks=tracks.filter(t=>now-t.seen<1000);

      // disegno overlay
      ctx.clearRect(0,0,c.width,c.height);
      ctx.strokeStyle='#f5a623'; ctx.lineWidth=3; ctx.setLineDash([12,8]);
      ctx.beginPath(); ctx.moveTo(lineX,0); ctx.lineTo(lineX,c.height); ctx.stroke();
      ctx.setLineDash([]);
      for(const t of tracks){
        ctx.strokeStyle='#39c46d'; ctx.lineWidth=2;
        ctx.strokeRect(...t.box);
        ctx.fillStyle='#39c46d';
        ctx.beginPath(); ctx.arc(t.x,t.y,5,0,7); ctx.fill();
      }
    }
    await new Promise(r=>setTimeout(r,120)); // ~8 fps, basta e risparmia batteria
  }
}

render();
</script>
</body>
</html>
